# Optional tools - GENERATED by vexor, do not edit (change images/ports/flags in .env instead).
# Enable with N8N=true / GRAFANA=true / PORTAINER=true / SURICATA=true / ZEEK=true in .env,
# then: vexor tools apply   (start / restart / config apply do the same).
x-tool-logging: &tool-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-50m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  n8n:                                   # https://PUBLIC_HOST:N8N_PORT (through nginx)
    profiles: ["n8n"]
    image: ${N8N_IMAGE:-n8nio/n8n:2.40.0}
    hostname: n8n
    restart: always
    logging: *tool-logging
    environment:
      N8N_HOST: ${PUBLIC_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${PUBLIC_HOST:-localhost}:${N8N_PORT:-55678}/
      WEBHOOK_URL: https://${PUBLIC_HOST:-localhost}:${N8N_PORT:-55678}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n

  grafana:                               # https://PUBLIC_HOST:GRAFANA_PORT (through nginx)
    profiles: ["grafana"]
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:13.0.2}
    hostname: grafana
    restart: always
    logging: *tool-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:-localhost}:${GRAFANA_PORT:-53000}/
      GF_PLUGINS_PREINSTALL: grafana-opensearch-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      WAZUH_GRAFANA_INDEXER_PASSWORD: ${GRAFANA_INDEXER_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/tools/grafana/provisioning:/etc/grafana/provisioning:ro

  portainer:                             # https://PUBLIC_HOST:PORTAINER_PORT (through nginx)
    profiles: ["portainer"]
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:2.45.1}
    hostname: portainer
    restart: always
    logging: *tool-logging
    command: ["-H", "unix:///var/run/docker.sock", "--admin-password-file", "/run/vexor/portainer_admin_password"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
      - ./config/tools/portainer/admin_password:/run/vexor/portainer_admin_password:ro

  suricata:                              # IDS on SNIFF_INTERFACE; eve.json -> wazuh.master (localfile)
    profiles: ["suricata"]
    image: ${SURICATA_IMAGE:-jasonish/suricata:8.0.5}
    restart: always
    logging: *tool-logging
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["-i", "${SNIFF_INTERFACE:-eth0}"]
    volumes:
      - ./tools-data/suricata/log:/var/log/suricata
      - suricata-lib:/var/lib/suricata

  zeek:                                  # network logs on SNIFF_INTERFACE; JSON logs -> wazuh.master
    profiles: ["zeek"]
    image: ${ZEEK_IMAGE:-zeek/zeek:8.2.2}
    restart: always
    logging: *tool-logging
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    working_dir: /zeek-logs
    command: ["zeek", "-C", "-i", "${SNIFF_INTERFACE:-eth0}", "/zeek-vexor/vexor.zeek"]
    volumes:
      - ./tools-data/zeek/logs:/zeek-logs
      - ./config/tools/zeek:/zeek-vexor:ro

volumes:
  n8n-data:
  grafana-data:
  portainer-data:
  suricata-lib:
