# Vexor - Wazuh services (managers, indexers, dashboard) + nginx.
# Do not start this file directly: use `./vexor start` (COMPOSE_FILE / COMPOSE_PROFILES in .env
# select the layout: SOC=wazuh|elk|both, NODE_TYPE=single|multi, WORKER_COUNT, tools).
# Profiles: wazuh (master, wazuh1.indexer, dashboard), multi (wazuh.worker), w2/w3 (workers 2-3),
# ix3 (indexers 2-3). nginx always runs; its ports come from docker-compose.override.yml.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-50m}"
    max-file: "${LOG_MAX_FILE:-5}"

x-manager-ulimits: &manager-ulimits
  memlock:
    soft: -1
    hard: -1
  nofile:
    soft: 655360
    hard: 655360

x-indexer-ulimits: &indexer-ulimits
  memlock:
    soft: -1
    hard: -1
  nofile:
    soft: 65536
    hard: 65536

x-indexer-env: &indexer-env
  OPENSEARCH_JAVA_OPTS: "-Xms${INDEXER_HEAP:-1g} -Xmx${INDEXER_HEAP:-1g}"
  bootstrap.memory_lock: "true"

x-worker-env: &worker-env
  INDEXER_URL: https://wazuh1.indexer:9200
  INDEXER_USERNAME: ${INDEXER_USERNAME:-admin}
  INDEXER_PASSWORD: ${INDEXER_PASSWORD}
  FILEBEAT_SSL_VERIFICATION_MODE: full
  SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
  SSL_CERTIFICATE: /etc/ssl/filebeat.pem
  SSL_KEY: /etc/ssl/filebeat.key

services:
  # ---------------------------------------------------------- managers
  wazuh.master:
    profiles: ["wazuh"]   # off when SOC=elk (vexor soc)
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.master
    restart: always
    logging: *default-logging
    ulimits: *manager-ulimits
    ports:
      - "${BIND_IP:-0.0.0.0}:${ENROLL_PORT:-1515}:1515"
      - "${BIND_IP:-0.0.0.0}:${SYSLOG_PORT:-514}:514/udp"
      - "${BIND_IP:-0.0.0.0}:${API_PORT:-55000}:55000"
    environment:
      INDEXER_URL: '"https://wazuh1.indexer:9200","https://wazuh2.indexer:9200","https://wazuh3.indexer:9200"'
      INDEXER_USERNAME: ${INDEXER_USERNAME:-admin}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - master-wazuh-api-configuration:/var/ossec/api/configuration
      - master-wazuh-etc:/var/ossec/etc
      - master-wazuh-logs:/var/ossec/logs
      - master-wazuh-queue:/var/ossec/queue
      - master-wazuh-var-multigroups:/var/ossec/var/multigroups
      - master-wazuh-integrations:/var/ossec/integrations
      - master-wazuh-active-response:/var/ossec/active-response/bin
      - master-wazuh-agentless:/var/ossec/agentless
      - master-wazuh-wodles:/var/ossec/wodles
      - master-filebeat-etc:/etc/filebeat
      - master-filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.master.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.master-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.worker:
    profiles: ["multi"]   # off when NODE_TYPE=single (vexor node-type single)
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.worker
    restart: always
    logging: *default-logging
    ulimits: *manager-ulimits
    environment: *worker-env
    volumes:
      - worker-wazuh-api-configuration:/var/ossec/api/configuration
      - worker-wazuh-etc:/var/ossec/etc
      - worker-wazuh-logs:/var/ossec/logs
      - worker-wazuh-queue:/var/ossec/queue
      - worker-wazuh-var-multigroups:/var/ossec/var/multigroups
      - worker-wazuh-integrations:/var/ossec/integrations
      - worker-wazuh-active-response:/var/ossec/active-response/bin
      - worker-wazuh-agentless:/var/ossec/agentless
      - worker-wazuh-wodles:/var/ossec/wodles
      - worker-filebeat-etc:/etc/filebeat
      - worker-filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.worker.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.worker-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_worker.conf:/wazuh-config-mount/etc/ossec.conf

  # Extra workers: started only when NODE_TYPE=multi and WORKER_COUNT >= 2 / 3 (vexor scale)
  wazuh2.worker:
    profiles: ["w2"]
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh2.worker
    restart: always
    logging: *default-logging
    ulimits: *manager-ulimits
    environment: *worker-env
    volumes:
      - worker2-wazuh-api-configuration:/var/ossec/api/configuration
      - worker2-wazuh-etc:/var/ossec/etc
      - worker2-wazuh-logs:/var/ossec/logs
      - worker2-wazuh-queue:/var/ossec/queue
      - worker2-wazuh-var-multigroups:/var/ossec/var/multigroups
      - worker2-wazuh-integrations:/var/ossec/integrations
      - worker2-wazuh-active-response:/var/ossec/active-response/bin
      - worker2-wazuh-agentless:/var/ossec/agentless
      - worker2-wazuh-wodles:/var/ossec/wodles
      - worker2-filebeat-etc:/etc/filebeat
      - worker2-filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh2.worker.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh2.worker-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_worker2.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh3.worker:
    profiles: ["w3"]
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh3.worker
    restart: always
    logging: *default-logging
    ulimits: *manager-ulimits
    environment: *worker-env
    volumes:
      - worker3-wazuh-api-configuration:/var/ossec/api/configuration
      - worker3-wazuh-etc:/var/ossec/etc
      - worker3-wazuh-logs:/var/ossec/logs
      - worker3-wazuh-queue:/var/ossec/queue
      - worker3-wazuh-var-multigroups:/var/ossec/var/multigroups
      - worker3-wazuh-integrations:/var/ossec/integrations
      - worker3-wazuh-active-response:/var/ossec/active-response/bin
      - worker3-wazuh-agentless:/var/ossec/agentless
      - worker3-wazuh-wodles:/var/ossec/wodles
      - worker3-filebeat-etc:/etc/filebeat
      - worker3-filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh3.worker.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh3.worker-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_worker3.conf:/wazuh-config-mount/etc/ossec.conf

  # ---------------------------------------------------------- indexers
  wazuh1.indexer:
    profiles: ["wazuh"]   # off when SOC=elk (vexor soc)
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh1.indexer
    restart: always
    logging: *default-logging
    ports:
      - "${INDEXER_BIND:-127.0.0.1}:${INDEXER_HOST_PORT:-9200}:9200"
    environment: *indexer-env
    ulimits: *indexer-ulimits
    volumes:
      - wazuh-indexer-data-1:/var/lib/wazuh-indexer
      - ${BACKUP_DIR:-./backups}/snapshots:/mnt/snapshots
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh1.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh1.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh1.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh1.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh1.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh2.indexer:
    profiles: ["ix3"]   # off when INDEXER_COUNT=1 (vexor indexers 1)
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh2.indexer
    restart: always
    logging: *default-logging
    environment: *indexer-env
    ulimits: *indexer-ulimits
    volumes:
      - wazuh-indexer-data-2:/var/lib/wazuh-indexer
      - ${BACKUP_DIR:-./backups}/snapshots:/mnt/snapshots
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh2.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh2.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh2.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh2.indexer.pem
      - ./config/wazuh_indexer/wazuh2.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh3.indexer:
    profiles: ["ix3"]   # off when INDEXER_COUNT=1 (vexor indexers 1)
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh3.indexer
    restart: always
    logging: *default-logging
    environment: *indexer-env
    ulimits: *indexer-ulimits
    volumes:
      - wazuh-indexer-data-3:/var/lib/wazuh-indexer
      - ${BACKUP_DIR:-./backups}/snapshots:/mnt/snapshots
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh3.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh3.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh3.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh3.indexer.pem
      - ./config/wazuh_indexer/wazuh3.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  # ---------------------------------------------------------- dashboard
  # multi: not published on the host, reached through nginx (PROXY_PORT).
  # single: published on PROXY_PORT by docker-compose.override.yml.
  wazuh.dashboard:
    profiles: ["wazuh"]   # off when SOC=elk (vexor soc)
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    hostname: wazuh.dashboard
    restart: always
    logging: *default-logging
    environment:
      OPENSEARCH_HOSTS: '"https://wazuh1.indexer:9200"'
      WAZUH_API_URL: '"https://wazuh.master"'
      API_USERNAME: ${API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${API_PASSWORD}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-kibanaserver}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh1.indexer
      - wazuh.master

  # ---------------------------------------------------------- nginx
  #  :${PROXY_PORT} (https) -> dashboard      :${AGENT_PORT} (tcp) -> manager cluster   (multi only)
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable}
    hostname: nginx
    restart: always
    logging: *default-logging
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PROXY_CERT:-./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem}:/etc/nginx/certs/proxy.pem:ro
      - ${PROXY_KEY:-./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem}:/etc/nginx/certs/proxy-key.pem:ro

volumes:
  master-wazuh-api-configuration:
  master-wazuh-etc:
  master-wazuh-logs:
  master-wazuh-queue:
  master-wazuh-var-multigroups:
  master-wazuh-integrations:
  master-wazuh-active-response:
  master-wazuh-agentless:
  master-wazuh-wodles:
  master-filebeat-etc:
  master-filebeat-var:
  worker-wazuh-api-configuration:
  worker-wazuh-etc:
  worker-wazuh-logs:
  worker-wazuh-queue:
  worker-wazuh-var-multigroups:
  worker-wazuh-integrations:
  worker-wazuh-active-response:
  worker-wazuh-agentless:
  worker-wazuh-wodles:
  worker-filebeat-etc:
  worker-filebeat-var:
  worker2-wazuh-api-configuration:
  worker2-wazuh-etc:
  worker2-wazuh-logs:
  worker2-wazuh-queue:
  worker2-wazuh-var-multigroups:
  worker2-wazuh-integrations:
  worker2-wazuh-active-response:
  worker2-wazuh-agentless:
  worker2-wazuh-wodles:
  worker2-filebeat-etc:
  worker2-filebeat-var:
  worker3-wazuh-api-configuration:
  worker3-wazuh-etc:
  worker3-wazuh-logs:
  worker3-wazuh-queue:
  worker3-wazuh-var-multigroups:
  worker3-wazuh-integrations:
  worker3-wazuh-active-response:
  worker3-wazuh-agentless:
  worker3-wazuh-wodles:
  worker3-filebeat-etc:
  worker3-filebeat-var:
  wazuh-indexer-data-1:
  wazuh-indexer-data-2:
  wazuh-indexer-data-3:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
